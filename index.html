<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="HandheldFriendly" content="true">
    <title>Competitor Sliders</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon"> <!-- Favicon for browsers -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180"> <!-- iOS app icon -->
    
    <!-- Add Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro&family=Pacifico&family=Crimson+Text:wght@600;700&family=Inter:wght@600&display=swap" rel="stylesheet">
    
    <!-- Sets the status bar style to transparent -->
    <meta name="mobile-web-app-capable" content="yes"> <!-- Updated meta tag -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> <!-- Transparent status bar -->
</head>
<body>
    <div class="hero-section">
        <img src="images/HeroWine.png" alt="Hero Wine" class="hero-image"> <!-- Placeholder image -->
    </div>
    <div class="container">
        <!-- Marz Section -->
        <div class="section-box">
            <h1>Marz</h1>
            <div class="rating-section">
                <div class="stars-and-buttons">
                    <button class="slider-button" id="marzStarMinus">-</button>
                    <div id="marz-stars" data-rating="3.0">
                        <span class="star" data-value="1">★</span>
                        <span class="star" data-value="2">★</span>
                        <span class="star" data-value="3">★</span>
                        <span class="star" data-value="4">★</span>
                        <span class="star" data-value="5">★</span>
                    </div>
                    <button class="slider-button" id="marzStarPlus">+</button>
                </div>
                <div class="rating-display">Rating: 3.0</div>
            </div>
            <div class="slider-group">
                <button class="slider-button">-</button>
                <label for="marzSlider1">Light</label>
                <input type="range" min="1" max="5" step="0.5" value="3" class="slider" id="marzSlider1">
                <span class="slider-label">Bold</span>
                <span class="value-circle" id="marzCircle1">3</span> <!-- Moved to the right -->
                <button class="slider-button">+</button>
            </div>
            <div class="slider-group">
                <button class="slider-button">-</button>
                <label for="marzSlider2">Smooth</label>
                <input type="range" min="1" max="5" step="0.5" value="3" class="slider" id="marzSlider2">
                <span class="slider-label">Tannic</span>
                <span class="value-circle" id="marzCircle2">3</span> <!-- Moved to the right -->
                <button class="slider-button">+</button>
            </div>
            <div class="slider-group">
                <button class="slider-button">-</button>
                <label for="marzSlider3">Dry</label>
                <input type="range" min="1" max="5" step="0.5" value="3" class="slider" id="marzSlider3">
                <span class="slider-label">Sweet</span>
                <span class="value-circle" id="marzCircle3">3</span> <!-- Moved to the right -->
                <button class="slider-button">+</button>
            </div>
            <div class="slider-group">
                <button class="slider-button">-</button>
                <label for="marzSlider4">Soft</label>
                <input type="range" min="1" max="5" step="0.5" value="3" class="slider" id="marzSlider4">
                <span class="slider-label">Acidic</span>
                <span class="value-circle" id="marzCircle4">3</span> <!-- Moved to the right -->
                <button class="slider-button">+</button>
            </div>
            <h2>Flavours:</h2>
            <div class="flavour-inputs"> <!-- New div for flavor inputs -->
                <div style="display: flex; justify-content: space-between;">
                    <input type="text" id="marzFlavour1" placeholder="Flavour One">
                    <input type="text" id="marzFlavour2" placeholder="Flavour Two">
                </div>
            </div>
        </div>

            </div>

            <h2>Flavours:</h2>
            <div class="flavour-inputs"> <!-- New div for flavor inputs -->
                <div style="display: flex; justify-content: space-between;">

            </div>
        </div>

        <!-- Import section temporarily disabled - will be implemented later
        <div class="import-section">
            <input type="text" id="vivino-url" placeholder="Paste Vivino URL here">
            <button onclick="importWineData(document.getElementById('vivino-url').value)">Import Wine Data</button>
        </div>
        -->

        <button class="calculate-button">Calculate Winner 🍷</button>
        <h2 id="result"></h2>
        <h3 id="pointsBreakdown"></h3>
    </div>

    <script src="script.js"></script>
</body>
</html>
